upstream {{ deployment_name | mandatory }} {
    server {{ odoo_backend | mandatory }}:{{ odoo_backend_port | mandatory }};
}

{% if odoo_workers > 0 %}
upstream {{ deployment_name | mandatory }}-websocket {
    server {{ odoo_backend | mandatory }}:{{ odoo_backend_port_websocket | mandatory }};
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
{% endif %}

{% for i in odoo_forwards %}
server {
    server_name {{ i.forward.src }};
    return 301 https://{{ i.forward.dest }}$request_uri;
}
{% endfor %}

server {
    server_name {{ odoo_frontend | mandatory }}
        {% for alias in odoo_aliases %}
        {{ alias }}
        {% endfor %}
        ;

    access_log /var/log/nginx/{{ deployment_name | mandatory }}.access.log;
    error_log /var/log/nginx/{{ deployment_name | mandatory }}.error.log;

    # defaults
    client_max_body_size {{ odoo_client_max_body_size | mandatory }};

    # proxy timeouts
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://{{ deployment_name | mandatory }};
        proxy_redirect off;
    }

    {% if odoo_workers > 0 %}
    location /websocket {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://{{ deployment_name | mandatory }}-websocket;
    }
    {% endif %}

    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://{{ deployment_name | mandatory }};
    }

    # deny database manager
    {% if not odoo_list_db %}
    location /web/database/manager {
        deny all;
    }
    {% endif %}

    # gzip
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;
    gzip on;
}