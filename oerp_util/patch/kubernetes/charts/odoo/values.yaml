# Default values for odoo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
maxCronReplicaCount: 1

# odoo startup check. failureThreshold * periodSeconds defines the maximum
# time the worker may take before liveness/readiness become active. The
# default tolerates ~1 hour to cover the safety-net case where a worker
# pod was restarted while a long-running restore (large database, slow
# storage backend) is still in progress and ODOO_WAIT_FOR_RESTORE blocks
# the server start. In the regular install flow the restore Job has
# already completed before workers start, so the probe succeeds within
# seconds.
startupProbe:
  enabled: true
  path: '/web/health'
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 120

# odoo live check
livenessProbe:
  enabled: true
  path: '/web/health'
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

# odoo read check
readinessProbe:
  enabled: true
  path: '/web/health'
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

# general configuration
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8069
  websocketPort: 8072

hosts: []

# cert-manager Certificate. By default the produced TLS Secret is named
# "<release>-tls" (resolved via the `odoo.tlsSecretName` helper) so multiple
# instances of this chart can coexist in the same namespace without
# collisions on the Certificate resource name or the Secret name.
certmanager:
  enabled: false
  issuer: "letsencrypt-prod"
  # ClusterIssuer (cluster-scoped) or Issuer (namespace-scoped)
  issuerKind: "ClusterIssuer"
  # Override the auto-generated TLS Secret name. Leave empty to use
  # "<release>-tls" (recommended for multi-instance namespaces).
  secretName: ""
  # Optional CN (deprecated by cert-manager; modern CAs ignore it and it
  # is limited to 64 chars). Leave empty to omit; SANs in `dnsNames`
  # cover all hosts.
  commonName: ""
  # Optional Certificate spec extras (passed through verbatim).
  duration: ""
  renewBefore: ""
  privateKey: {}
  annotations: {}

ingress:
  enabled: false
  cloudflare: false
  maxBodySize: "512m"
  timeout: "720"
  className: ""
  # Leave empty to inherit from cert-manager when enabled, or to disable
  # TLS entirely when no manual TLS Secret is provided.
  tlsSecretName: ""
  annotations: {}

ingressroute:
  enabled: false
  className: "traefik"
  certManagerIssuer: "letsencrypt-prod"
  # See `ingress.tlsSecretName` for resolution rules.
  tlsSecretName: ""
  annotations: {}

resources:
  limits:
     memory: "8Gi"
     cpu: "1"
  requests:
     cpu: "250m"
     memory: "500Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
