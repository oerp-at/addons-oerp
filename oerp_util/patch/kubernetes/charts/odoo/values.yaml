# Default values for odoo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
maxCronReplicaCount: 1

# odoo live check
livenessProbe:
  enabled: true
  path: '/web/health'
  initialDelaySeconds: 600
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

# odoo read check
readinessProbe:
  enabled: true
  path: '/web/health'
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

# general configuration
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8069
  websocketPort: 8072

hosts: []

certmanager:
  enabled: false
  issuer: "letsencrypt-prod"
  secretName: "odoo-tls"
  annotations: {}

ingress:
  enabled: false
  cloudflare: false
  maxBodySize: "512m"
  timeout: "720"
  className: ""
  tlsSecretName: "odoo-tls"
  annotations: {}

ingressroute:
  enabled: false
  className: "traefik"
  certManagerIssuer: "letsencrypt-prod"
  tlsSecretName: "odoo-tls"
  annotations: {}

resources:
  limits:
     memory: "8Gi"
     cpu: "1"
  requests:
     cpu: "250m"
     memory: "500Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

