{{- if and .Values.certmanager.enabled .Values.hosts }}
{{- $tlsSecretName := include "odoo.tlsSecretName" . -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $tlsSecretName }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
  {{- with .Values.certmanager.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ $tlsSecretName }}
  {{- with .Values.certmanager.commonName }}
  commonName: {{ . | quote }}
  {{- end }}
  dnsNames:
    {{- range .Values.hosts }}
    - {{ . | quote }}
    {{- end }}
  {{- with .Values.certmanager.duration }}
  duration: {{ . | quote }}
  {{- end }}
  {{- with .Values.certmanager.renewBefore }}
  renewBefore: {{ . | quote }}
  {{- end }}
  {{- with .Values.certmanager.privateKey }}
  privateKey:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  issuerRef:
    name: {{ .Values.certmanager.issuer }}
    kind: {{ .Values.certmanager.issuerKind | default "ClusterIssuer" }}
{{- end }}
