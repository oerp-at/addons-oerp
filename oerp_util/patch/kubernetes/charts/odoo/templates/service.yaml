apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.longpollingPort }}
      targetPort: http-poll
      protocol: TCP
      name: http-poll
  selector:
    {{- include "odoo.selectorLabels" . | nindent 4 }}
