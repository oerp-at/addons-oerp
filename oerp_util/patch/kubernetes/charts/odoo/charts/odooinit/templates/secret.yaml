{{/*
Secrets are rendered as pre-install / pre-upgrade hooks (weight -30) so that
the restore Job (weight -10) and all other lifecycle Jobs (backup, update,
scaledown) can mount them. They are recreated on each install/upgrade with
the current values; running Pods keep using their already-mounted Secret
revision until they are restarted by the regular Deployment rollout.
*/}}
{{- $hookAnnotations := dict
    "helm.sh/hook" "pre-install,pre-upgrade"
    "helm.sh/hook-weight" "-30"
    "helm.sh/hook-delete-policy" "before-hook-creation"
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odoo.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "odoo.labels" . | indent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-21"
    {{- range $k, $v := $hookAnnotations }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
    {{- with .Values.secretAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  odoo-cron.conf: {{ include "odoo-cron.config" . | b64enc | quote }}
  odoo.conf: {{ include "odoo.config" . | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "odoo.fullname" . }}-postgres-config"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "odoo.labels" . | indent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-21"
    {{- range $k, $v := $hookAnnotations }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
    {{- with .Values.secretAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  PGHOST: {{ .Values.pgHost | b64enc | quote }}
  PGUSER: {{ .Values.pgUser | b64enc | quote }}
  PGPORT: {{ .Values.pgPort | b64enc | quote }}
  PGDATABASE: {{ .Values.pgDatabase | b64enc | quote }}
  PGPASSWORD: {{ .Values.pgPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "odoo.fullname" . }}-postgres-admin-config"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "odoo.labels" . | indent 4 }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
    {{- with .Values.secretAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  PGADMINUSER: {{ .Values.pgAdminUser | b64enc | quote }}
  PGADMINPASSWORD: {{ .Values.pgAdminPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "odoo.fullname" . }}-backup-store-config"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "odoo.labels" . | indent 4 }}
  annotations:
    {{- range $k, $v := $hookAnnotations }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
    {{- with .Values.secretAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  AWS_DEFAULT_REGION: {{ .Values.backup.storeRegion | b64enc | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.backup.storeKey | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.backup.storeSecret | b64enc | quote }}
  RESTIC_PASSWORD: {{ .Values.backup.storePassword | b64enc | quote }}
