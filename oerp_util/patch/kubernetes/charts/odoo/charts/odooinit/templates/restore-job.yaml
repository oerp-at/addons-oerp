{{/*
Restore Job. Runs as:
  * pre-install hook (weight -10) when restore.enabled is true. On a fresh
    install with no restore-fs/restore-db source the job initializes an
    empty database; otherwise it restores the database and/or filestore
    from the configured paths. Either way it writes the `restored` marker
    file so workers can leave their `wait_for_restore` loop.
  * pre-upgrade hook (weight -10) when restore.onUpdate is true. Rolls
    back the database/filestore from the configured source before the
    update Job runs.

PVCs and Secrets are themselves pre-install/pre-upgrade hooks at weight -30
so they are guaranteed to exist when this Job runs.
*/}}
{{- $hooks := list -}}
{{- if .Values.restore.enabled -}}
{{-   $hooks = append $hooks "pre-install" -}}
{{- end -}}
{{- if and .Values.restore.onUpdate (not .Values.setup) -}}
{{-   $hooks = append $hooks "pre-upgrade" -}}
{{- end -}}
{{- if $hooks -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "odoo.fullname" . }}-restore
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    "helm.sh/hook": {{ $hooks | join "," | quote }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 0
  {{- with .Values.restore.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "odoo.fullname" . }}-restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          args:
          - restore
          {{- if .Values.restore.filestorePath }}
          - "--restore-fs={{ .Values.restore.filestorePath }}"
          {{- end }}
          {{- if .Values.restore.databasePath }}
          - "--restore-db={{ .Values.restore.databasePath }}"
          {{- end }}
          {{- if .Values.restore.installModule }}
          - "--install={{ .Values.restore.installModule }}"
          {{- end }}
          - "--update"
          - "--wait-for-data"
          volumeMounts:
            - name: {{ include "odoo.fullname" . }}-config-vol
              mountPath: /data/etc
              readOnly: true
            - name: {{ include "odoo.fullname" . }}-session-vol
              mountPath: /data/sessions
            - name: {{ include "odoo.fullname" . }}-filestore-vol
              mountPath: /data/filestore
            {{- if .Values.backup.volumeClaim }}
            - name: {{ include "odoo.fullname" . }}-backup-vol
              mountPath: /data/backup
            {{- end }}
            {{- with .Values.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: "{{ include "odoo.fullname" . }}-postgres-config"
            - secretRef:
                name: "{{ include "odoo.fullname" . }}-postgres-admin-config"
      volumes:
        - name: {{ include "odoo.fullname" . }}-config-vol
          secret:
            secretName: {{ include "odoo.fullname" . }}-config
        - name: {{ include "odoo.fullname" . }}-session-vol
          persistentVolumeClaim:
            claimName: {{ include "odoo.fullname" . }}-sessionstore
        - name: {{ include "odoo.fullname" . }}-filestore-vol
          persistentVolumeClaim:
            claimName: {{ include "odoo.fullname" . }}-filestore
        {{- if .Values.backup.volumeClaim }}
        - name: {{ include "odoo.fullname" . }}-backup-vol
          persistentVolumeClaim:
            claimName: {{ .Values.backup.volumeClaim }}
        {{- end }}
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
