kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "odoo.fullname" . }}-filestore
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "odoo.labels" . | indent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-21"
spec:
  storageClassName: {{ .Values.filestore.storageClassName }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.filestore.size | quote }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "odoo.fullname" . }}-sessionstore
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "odoo.labels" . | indent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-21"
spec:
  storageClassName: {{ .Values.sessionstore.storageClassName }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.sessionstore.size | quote }}