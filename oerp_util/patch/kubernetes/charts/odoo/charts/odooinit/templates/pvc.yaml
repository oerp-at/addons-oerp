kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "odoo.fullname" . }}-filestore
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "odoo.labels" . | indent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-21"
    # PVC is created as a pre-install hook so it is available for the
    # pre-install restore Job (which runs before regular resources).
    # The keep policy ensures the volume survives Helm uninstall and
    # any future hook lifecycle changes; pre-upgrade is intentionally
    # omitted so the PVC is never re-created on upgrades.
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-weight": "-30"
    "helm.sh/resource-policy": "keep"
spec:
  storageClassName: {{ .Values.filestore.storageClassName }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.filestore.size | quote }}
{{- if not .Values.sessionstore.db }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "odoo.fullname" . }}-sessionstore
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "odoo.labels" . | indent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-21"
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-weight": "-30"
    "helm.sh/resource-policy": "keep"
spec:
  storageClassName: {{ .Values.sessionstore.storageClassName }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.sessionstore.size | quote }}
{{- end }}
