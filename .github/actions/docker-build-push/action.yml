name: Docker Build and Push
description: >
  Logs in to a container registry, extracts metadata (tags, labels),
  builds a Docker image and pushes it. With pull-token the build reads the
  base images with that token and the image is pushed with github-token.

inputs:
  github-token:
    description: GitHub token for registry authentication (pass secrets.GITHUB_TOKEN)
    required: true
  pull-token:
    description: >
      Optional token with read:packages for private base images the
      repository has no Actions access to (e.g. secrets.GHCR_READ_TOKEN).
      The build reads with it, the push uses github-token. Empty:
      github-token does both, as before.
    required: false
    default: ""
  registry:
    description: Container registry URL
    required: false
    default: ghcr.io
  image:
    description: Full image name (default derives from github.repository)
    required: false
    default: ""
  context:
    description: Docker build context path
    required: false
    default: "."
  push:
    description: Whether to push the image after building
    required: false
    default: "true"
  version-tag:
    description: Optional additional version tag (e.g. chart version from odoo-detect-manifest-version)
    required: false
    default: ""

outputs:
  tags:
    description: Generated image tags
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: Image digest
    value: ${{ steps.push.outputs.digest || steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    # Docker keeps one login per registry: with pull-token the build reads
    # with it and the push logs in again with github-token further down.
    - name: Log in to container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.pull-token || inputs.github-token }}

    - name: Resolve image name
      id: image
      shell: bash
      run: |
        IMAGE="${{ inputs.image }}"
        if [ -z "$IMAGE" ]; then
          IMAGE="${{ inputs.registry }}/${{ github.repository }}"
        fi
        echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.image.outputs.name }}
        tags: |
          type=ref,event=branch
          type=sha
          type=raw,value=${{ inputs.version-tag }},enable=${{ inputs.version-tag != '' }}

    # With pull-token the image stays in the local store of the docker
    # driver and is pushed by the steps below.
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.pull-token == '' && inputs.push || 'false' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    # The first login logs out at the end of the job, once is enough.
    - name: Log in to push with github-token
      if: inputs.pull-token != '' && inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
        logout: false

    - name: Push Docker image
      id: push
      if: inputs.pull-token != '' && inputs.push == 'true'
      shell: bash
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        IMAGE: ${{ steps.image.outputs.name }}
      run: |
        set -euo pipefail
        FIRST=""
        while IFS= read -r TAG; do
          [ -n "$TAG" ] || continue
          docker push "$TAG"
          FIRST="${FIRST:-$TAG}"
        done <<< "$TAGS"
        # metadata-action writes the tags in lower case, docker wants it so
        DIGEST=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$FIRST" \
          | grep -m1 "^${IMAGE,,}@" | cut -d@ -f2 || true)
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
