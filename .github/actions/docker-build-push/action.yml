name: Docker Build and Push
description: >
  Logs in to a container registry, extracts metadata (tags, labels),
  builds a Docker image and pushes it.

inputs:
  github-token:
    description: GitHub token for registry authentication (pass secrets.GITHUB_TOKEN)
    required: true
  registry:
    description: Container registry URL
    required: false
    default: ghcr.io
  image:
    description: Full image name (default derives from github.repository)
    required: false
    default: ""
  context:
    description: Docker build context path
    required: false
    default: "."
  push:
    description: Whether to push the image after building
    required: false
    default: "true"
  version-tag:
    description: Optional additional version tag (e.g. chart version from odoo-detect-manifest-version)
    required: false
    default: ""

outputs:
  tags:
    description: Generated image tags
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: Image digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Log in to container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Resolve image name
      id: image
      shell: bash
      run: |
        IMAGE="${{ inputs.image }}"
        if [ -z "$IMAGE" ]; then
          IMAGE="${{ inputs.registry }}/${{ github.repository }}"
        fi
        echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.image.outputs.name }}
        tags: |
          type=ref,event=branch
          type=sha
          type=raw,value=${{ inputs.version-tag }},enable=${{ inputs.version-tag != '' }}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
