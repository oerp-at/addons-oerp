name: Odoo Bump Chart Version
description: >
  Updates appVersion and version in a Helm Chart.yaml file,
  then commits and pushes the change.

inputs:
  chart-file:
    description: Path to the Helm Chart.yaml file
    required: false
    default: charts/odooi/Chart.yaml
  app-version:
    description: New appVersion value (e.g. 19.0.1.3.0)
    required: true
  chart-version:
    description: New chart version value (e.g. 19.0.3)
    required: true

runs:
  using: composite
  steps:
    - name: Update Chart.yaml and commit
      shell: bash
      run: |
        set -euo pipefail

        CHART_FILE="${{ inputs.chart-file }}"
        NEW_APP_VERSION="${{ inputs.app-version }}"
        NEW_CHART_VERSION="${{ inputs.chart-version }}"

        if [ ! -f "$CHART_FILE" ]; then
          echo "::error::Chart file '$CHART_FILE' not found."
          exit 1
        fi

        sed -i "s/^appVersion:.*/appVersion: \"${NEW_APP_VERSION}\"/" "$CHART_FILE"
        sed -i "s/^version:.*/version: ${NEW_CHART_VERSION}/" "$CHART_FILE"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$CHART_FILE"
        git commit -m "chore: bump Chart version to ${NEW_CHART_VERSION} (appVersion ${NEW_APP_VERSION})"
        git push
