name: Odoo Bump Chart Version
description: >
  Writes the given chart version into a Helm Chart.yaml, then commits and
  pushes the change as github-actions[bot]. The new version is typically
  computed beforehand by the odoo-next-chart-version action.

inputs:
  chart-file:
    description: Path to the Helm Chart.yaml file
    required: false
    default: charts/odooi/Chart.yaml
  chart-version:
    description: New chart version value to write into Chart.yaml (e.g. 19.0.4)
    required: true

runs:
  using: composite
  steps:
    - name: Write Chart.yaml version and push
      shell: bash
      run: |
        set -euo pipefail

        CHART_FILE="${{ inputs.chart-file }}"
        NEW_CHART_VERSION="${{ inputs.chart-version }}"

        if [ ! -f "$CHART_FILE" ]; then
          echo "::error::Chart file '$CHART_FILE' not found."
          exit 1
        fi

        if [ -z "$NEW_CHART_VERSION" ]; then
          echo "::error::Input 'chart-version' must not be empty."
          exit 1
        fi

        sed -i "s/^version:.*/version: ${NEW_CHART_VERSION}/" "$CHART_FILE"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$CHART_FILE"

        if git diff --cached --quiet; then
          echo "Chart version already at ${NEW_CHART_VERSION}; nothing to commit."
          exit 0
        fi

        git commit -m "chore: bump Chart version to ${NEW_CHART_VERSION}"
        git push
