name: Odoo Bump Chart Version
description: >
  Increments the patch component of the chart version in a Helm Chart.yaml,
  then commits and pushes the change. Outputs the new chart version.

inputs:
  chart-file:
    description: Path to the Helm Chart.yaml file
    required: false
    default: charts/odooi/Chart.yaml

outputs:
  chart_version:
    description: The new chart version after the bump (e.g. 19.0.4)
    value: ${{ steps.bump.outputs.chart_version }}

runs:
  using: composite
  steps:
    - name: Bump Chart.yaml and commit
      id: bump
      shell: bash
      run: |
        set -euo pipefail

        CHART_FILE="${{ inputs.chart-file }}"

        if [ ! -f "$CHART_FILE" ]; then
          echo "::error::Chart file '$CHART_FILE' not found."
          exit 1
        fi

        CURRENT_CHART_VERSION=$(grep '^version:' "$CHART_FILE" | sed 's/version: *//')
        if [ -z "$CURRENT_CHART_VERSION" ]; then
          echo "::error::Could not read current chart version from '$CHART_FILE'."
          exit 1
        fi

        IFS='.' read -r CV_MAJOR CV_MINOR CV_PATCH <<< "$CURRENT_CHART_VERSION"
        CV_PATCH=$((CV_PATCH + 1))
        NEW_CHART_VERSION="${CV_MAJOR}.${CV_MINOR}.${CV_PATCH}"

        sed -i "s/^version:.*/version: ${NEW_CHART_VERSION}/" "$CHART_FILE"

        echo "chart_version=${NEW_CHART_VERSION}" >> "$GITHUB_OUTPUT"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$CHART_FILE"
        git commit -m "chore: bump Chart version to ${NEW_CHART_VERSION}"
        git push
