name: Odoo Detect Manifest Version
description: >
  Detects Odoo __manifest__.py version changes between the current and previous
  commit and calculates bumped appVersion / chart version accordingly.
  If no manifest version changed but non-chart files were modified, the patch
  version is bumped automatically. Pure chart-only changes are skipped.
  Requires checkout with fetch-depth >= 2.

inputs:
  chart-file:
    description: Path to the Helm Chart.yaml file
    required: false
    default: charts/odooi/Chart.yaml

outputs:
  changed:
    description: "'true' if any manifest version changed, 'false' otherwise"
    value: ${{ steps.detect.outputs.changed }}
  app_version:
    description: New appVersion string (e.g. 19.0.1.3.0)
    value: ${{ steps.detect.outputs.app_version }}
  chart_version:
    description: New chart version string (e.g. 19.0.3)
    value: ${{ steps.detect.outputs.chart_version }}
  change_level:
    description: "Highest change level detected: major, minor, patch, or empty"
    value: ${{ steps.detect.outputs.change_level }}

runs:
  using: composite
  steps:
    - name: Validate git history depth
      shell: bash
      run: |
        if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
          echo "::error::Not enough git history. Ensure checkout uses fetch-depth >= 2."
          exit 1
        fi

    - name: Detect manifest version changes
      id: detect
      shell: bash
      run: |
        set -euo pipefail

        CHART_FILE="${{ inputs.chart-file }}"

        if [ ! -f "$CHART_FILE" ]; then
          echo "::warning::Chart file '$CHART_FILE' not found – skipping version detection."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "change_level=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CURRENT_APP_VERSION=$(grep '^appVersion:' "$CHART_FILE" | sed 's/appVersion: *"\?\([^"]*\)"\?/\1/')
        IFS='.' read -r ODOO_MAJOR ODOO_MINOR APP_MAJOR APP_MINOR APP_PATCH <<< "$CURRENT_APP_VERSION"

        HIGHEST_CHANGE=""

        for manifest in $(git diff --name-only HEAD~1 HEAD -- '*/__manifest__.py'); do
          if [ ! -f "$manifest" ]; then
            continue
          fi

          NEW_VERSION=$(python3 -c "
        import ast
        with open('$manifest') as f:
            data = ast.literal_eval(f.read())
        print(data.get('version', ''))
        ")

          OLD_VERSION=$(git show HEAD~1:"$manifest" 2>/dev/null | python3 -c "
        import ast, sys
        try:
            data = ast.literal_eval(sys.stdin.read())
            print(data.get('version', ''))
        except:
            print('')
        " || echo "")

          if [ -z "$NEW_VERSION" ] || [ -z "$OLD_VERSION" ]; then
            continue
          fi

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            continue
          fi

          echo "Version change in $manifest: $OLD_VERSION -> $NEW_VERSION"

          IFS='.' read -r _ _ OLD_MAJ OLD_MIN OLD_PAT <<< "$OLD_VERSION"
          IFS='.' read -r _ _ NEW_MAJ NEW_MIN NEW_PAT <<< "$NEW_VERSION"

          if [ "$NEW_MAJ" != "$OLD_MAJ" ]; then
            HIGHEST_CHANGE="major"
          elif [ "$NEW_MIN" != "$OLD_MIN" ] && [ "$HIGHEST_CHANGE" != "major" ]; then
            HIGHEST_CHANGE="minor"
          elif [ "$NEW_PAT" != "$OLD_PAT" ] && [ "$HIGHEST_CHANGE" != "major" ] && [ "$HIGHEST_CHANGE" != "minor" ]; then
            HIGHEST_CHANGE="patch"
          fi
        done

        if [ -z "$HIGHEST_CHANGE" ]; then
          NON_CHART_CHANGES=$(git diff --name-only HEAD~1 HEAD | grep -v '^charts/' || true)
          if [ -z "$NON_CHART_CHANGES" ]; then
            echo "Only chart changes detected – skipping version bump."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "change_level=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No manifest version changes but non-chart files changed – bumping patch."
          HIGHEST_CHANGE="patch"
        fi

        echo "Highest change level: $HIGHEST_CHANGE"

        case "$HIGHEST_CHANGE" in
          major)
            APP_MAJOR=$((APP_MAJOR + 1))
            APP_MINOR=0
            APP_PATCH=0
            ;;
          minor)
            APP_MINOR=$((APP_MINOR + 1))
            APP_PATCH=0
            ;;
          patch)
            APP_PATCH=$((APP_PATCH + 1))
            ;;
        esac

        NEW_APP_VERSION="${ODOO_MAJOR}.${ODOO_MINOR}.${APP_MAJOR}.${APP_MINOR}.${APP_PATCH}"
        echo "New appVersion: $NEW_APP_VERSION"

        CHART_VERSION=$(grep '^version:' "$CHART_FILE" | sed 's/version: *//')
        IFS='.' read -r CV_MAJOR CV_MINOR CV_PATCH <<< "$CHART_VERSION"
        CV_PATCH=$((CV_PATCH + 1))
        NEW_CHART_VERSION="${CV_MAJOR}.${CV_MINOR}.${CV_PATCH}"
        echo "New chart version: $NEW_CHART_VERSION"

        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "change_level=$HIGHEST_CHANGE" >> "$GITHUB_OUTPUT"
        echo "app_version=$NEW_APP_VERSION" >> "$GITHUB_OUTPUT"
        echo "chart_version=$NEW_CHART_VERSION" >> "$GITHUB_OUTPUT"
